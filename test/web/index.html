<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧茶园综合管理系统</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0a1628; --panel: #0d1f30; --border: #1a3040; --borderHi: #2a4050;
  --accent: #00d4ff; --text: #E8F4FF; --sub: #90A4AE; --cardBg: #0a1420;
  --btnBg1: #1a4060; --btnBg2: #0d2030; --btnBorder: #2a5070; --btnText: #90caf9;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Microsoft YaHei',sans-serif; overflow:hidden; height:100vh; display:flex; flex-direction:column; }
.header { display:flex; align-items:center; justify-content:center; padding:4px 16px; background:#0d2137; border-bottom:1px solid #1a4060; min-height:40px; gap:12px; }
.header .deco { color:#2a4050; font-size:12px; }
.header h1 { font-size:16px; color:var(--accent); font-weight:bold; white-space:nowrap; }
.header .theme-btn { background:var(--btnBg1); color:var(--btnText); border:1px solid var(--btnBorder); border-radius:3px; padding:2px 10px; font-size:11px; cursor:pointer; }
.body { display:flex; flex:1; gap:8px; padding:8px; overflow:hidden; min-height:0; }
.left { flex:1.1; display:flex; flex-direction:column; gap:6px; overflow-y:auto; min-width:0; }
.mid  { flex:1.2; display:flex; flex-direction:column; gap:6px; overflow-y:auto; min-width:0; }
.right{ flex:1.0; display:flex; flex-direction:column; gap:6px; overflow-y:auto; min-width:0; }
.panel { background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:8px; }
.panel .title { color:var(--accent); font-weight:bold; font-size:12px; margin-bottom:6px; }
.section-title { color:var(--accent); font-weight:bold; font-size:12px; margin-bottom:4px; }
.video-box { background:#000; border:1px solid var(--border); border-radius:4px; position:relative; overflow:hidden; }
.video-box img { width:100%; display:block; }
.video-box canvas { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
.metrics-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.metrics-grid .card { background:var(--cardBg); border:1px solid var(--border); border-radius:4px; padding:6px; text-align:center; }
.metrics-grid .card .val { font-size:18px; font-weight:bold; color:var(--accent); }
.metrics-grid .card .unit { font-size:10px; color:var(--sub); }
.btn { padding:5px 10px; border-radius:3px; border:1px solid var(--btnBorder); color:var(--btnText); font-size:11px; font-weight:bold; cursor:pointer;
  background: linear-gradient(180deg, var(--btnBg1) 0%, var(--btnBg2) 100%); }
.btn:hover { background:linear-gradient(180deg, #2a6090 0%, #1a4060 100%); color:#fff; }
.btn-row { display:flex; gap:4px; flex-wrap:wrap; }
.dir-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:3px; max-width:150px; }
.dir-grid .dir-btn { padding:8px 4px; font-size:18px; font-weight:bold; text-align:center;
  background:linear-gradient(180deg, #1a4060 0%, #0d2030 100%); border:1px solid #2a5070; border-radius:6px; color:#90caf9; cursor:pointer; user-select:none; }
.dir-grid .dir-btn:active { background:#2a6090; color:#fff; }
.spray-btn { background:linear-gradient(180deg, #1565C0 0%, #0D47A1 100%); border:1px solid #1E88E5; color:#fff; }
.spray-btn:active { background:#0D47A1; }
.chart-wrap { height:160px; flex-shrink:0; }
.chat-area { background:var(--cardBg); border:1px solid var(--border); border-radius:4px; flex:1; display:flex; flex-direction:column; overflow:hidden; }
.chat-msgs { flex:1; overflow-y:auto; padding:6px; font-size:11px; color:var(--sub); }
.chat-input { display:flex; gap:4px; padding:4px; border-top:1px solid var(--border); }
.chat-input input { flex:1; background:var(--cardBg); border:1px solid var(--border); color:var(--text); padding:4px 8px; border-radius:3px; font-size:11px; outline:none; }
.map-placeholder { background:var(--cardBg); border:1px solid var(--border); border-radius:4px; flex:1; display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:13px; }
.weather-card { background:var(--cardBg); border:1px solid var(--border); border-radius:4px; padding:8px; cursor:pointer; }
.status-bar { font-size:10px; color:var(--sub); text-align:center; padding:2px; border-top:1px solid var(--border); }
@media (max-width:900px) { .body { flex-direction:column; } }
</style>
</head>
<body>

<!-- 标题栏 -->
<div class="header">
  <span class="deco">━━━</span>
  <div style="flex:1"></div>
  <h1>智慧茶园综合管理系统</h1>
  <div style="flex:1"></div>
  <span class="deco">━━━</span>
  <button class="theme-btn" id="themeBtn">☀️ 日间</button>
</div>

<!-- 三栏主体 -->
<div class="body">
  <!-- 左栏 -->
  <div class="left">
    <div class="section-title">▎ 农业无人机实时监控</div>
    <div class="video-box"><img id="droneImg" src="" alt="等待视频流..."><canvas id="droneCanvas"></canvas></div>
    <div class="section-title">▎ 农业检测车实时监控</div>
    <div class="video-box"><img id="roverImg" src="" alt="等待图传..."></div>
    <div class="section-title">▎ 病虫害统计</div>
    <div class="chart-wrap"><canvas id="pestChart"></canvas></div>
    <div style="font-size:10px;color:var(--sub);" id="loraStatus">LoRa: 初始化中...</div>
    <div class="btn-row">
      <button class="btn" onclick="openPestBoard()">🐛 病虫害面板</button>
      <button class="btn" onclick="openChart()">📊 数据看板</button>
    </div>
    <div class="btn-row">
      <button class="btn" onclick="openRoverCtrl()">🚗 小车控制</button>
    </div>
    <!-- 农药泵 & 驱虫灯 -->
    <div class="btn-row">
      <button class="btn" id="pumpBtn">💧 灌溉泵</button>
      <button class="btn" id="pumpSchBtn" style="min-width:30px;padding:5px 6px;">⏰</button>
      <button class="btn" id="lampBtn">🪲 驱虫灯</button>
      <button class="btn" id="lampSchBtn" style="min-width:30px;padding:5px 6px;">⏰</button>
      <button class="btn" id="flowStatsBtn" style="min-width:30px;padding:5px 6px;">📊</button>
    </div>
    <!-- 灌溉统计面板(内联占位) -->
    <div class="panel" id="flowCard" style="display:none;">
      <div class="title">💧 灌溉进行中 <span id="flowPlanId" style="color:#ffcc80;font-size:10px;"></span></div>
      <div style="display:flex;gap:8px;">
        <div style="flex:1;text-align:center;"><div style="font-size:16px;font-weight:bold;" id="flowCur">0.0</div><div style="font-size:9px;color:var(--sub);">已灌溉(L)</div></div>
        <div style="flex:1;text-align:center;"><div style="font-size:16px;font-weight:bold;color:#4fc3f7;" id="flowExp">0.0</div><div style="font-size:9px;color:var(--sub);">预计(L)</div></div>
        <div style="flex:1;text-align:center;"><div style="font-size:16px;font-weight:bold;color:#ffcc80;" id="flowRem">--:--</div><div style="font-size:9px;color:var(--sub);">剩余</div></div>
      </div>
      <div style="height:5px;background:#333;border-radius:3px;margin-top:6px;"><div id="flowBar" style="height:100%;background:#4caf50;border-radius:3px;width:0%;"></div></div>
    </div>
  </div>

  <!-- 中栏 -->
  <div class="mid">
    <div class="section-title">▎ 茶园地图</div>
    <div class="map-placeholder">🗺 茶园地图</div>
    <div class="section-title">▎ 环境监控</div>
    <div class="metrics-grid" id="sensorGrid">
      <div class="card"><div class="val" id="airTemp">--</div><div class="unit">空气温度 ℃</div></div>
      <div class="card"><div class="val" id="airHumi">--</div><div class="unit">空气湿度 %</div></div>
      <div class="card"><div class="val" id="lightLux">--</div><div class="unit">光照强度 Lux</div></div>
      <div class="card"><div class="val" id="soilPh">--</div><div class="unit">土壤 pH</div></div>
      <div class="card"><div class="val" id="windSpd">--</div><div class="unit">风速 m/s</div></div>
      <div class="card"><div class="val" id="soilTemp">--</div><div class="unit">土壤温度 ℃</div></div>
      <div class="card"><div class="val" id="soilHumi">--</div><div class="unit">土壤湿度 %</div></div>
      <div class="card"><div class="val" id="soilEc">--</div><div class="unit">土壤电导率 mS/cm</div></div>
    </div>
  </div>

  <!-- 右栏 -->
  <div class="right">
    <div class="section-title">▎ 气象预警</div>
    <div class="weather-card" id="weatherCard">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-weight:bold;font-size:12px;" id="weatherTitle">🌤 24h预报</span>
        <button class="btn" id="weatherRefBtn" style="padding:2px 6px;font-size:10px;">↻</button>
      </div>
      <div id="weatherInfo" style="font-size:12px;color:var(--sub);margin-top:4px;">加载中...</div>
    </div>
    <div class="section-title">▎ AI 助手</div>
    <div class="chat-area">
      <div class="chat-msgs" id="chatMsgs">管家：您好！我是茶园AI管家...</div>
      <div class="chat-input">
        <input id="chatInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendChat()">
        <button class="btn" onclick="sendChat()">发送</button>
        <button class="btn" onclick="sendChatVoice()">🎤</button>
      </div>
    </div>
    <div class="section-title">▎ 小车控制</div>
    <div class="dir-grid">
      <div></div><button class="dir-btn" id="dirW" onmousedown="roverCmd('w',true)" onmouseup="roverCmd('w',false)" ontouchstart="roverCmd('w',true)" ontouchend="roverCmd('w',false)">W<br>⬆</button><div></div>
      <button class="dir-btn" id="dirA" onmousedown="roverCmd('a',true)" onmouseup="roverCmd('a',false)" ontouchstart="roverCmd('a',true)" ontouchend="roverCmd('a',false)">A<br>⬅</button>
      <button class="dir-btn" id="dirS" onmousedown="roverCmd('s',true)" onmouseup="roverCmd('s',false)" ontouchstart="roverCmd('s',true)" ontouchend="roverCmd('s',false)">S<br>⬇</button>
      <button class="dir-btn" id="dirD" onmousedown="roverCmd('d',true)" onmouseup="roverCmd('d',false)" ontouchstart="roverCmd('d',true)" ontouchend="roverCmd('d',false)">D<br>➡</button>
    </div>
    <button class="btn spray-btn" id="sprayBtn" style="margin-top:4px;padding:10px;"
      onmousedown="roverCmd('T',true)" onmouseup="roverCmd('F',false)"
      ontouchstart="roverCmd('T',true)" ontouchend="roverCmd('F',false)">💧 喷水</button>
  </div>
</div>
<div class="status-bar" id="statusBar">连接中...</div>

<script>
// ── WebSocket ──
var ws, pestCounts={}, yoloBoxes=[], darkMode=true;

function connect(){
  var p='ws:', h=location.hostname, port=(parseInt(location.port||'80')+1);
  ws=new WebSocket(p+'//'+h+':'+port);
  ws.binaryType='arraybuffer';
  ws.onopen=function(){ document.getElementById('statusBar').textContent='🟢 已连接 | 数据推送中'; };
  ws.onclose=function(){ document.getElementById('statusBar').textContent='🔴 断开，3s后重连...'; setTimeout(connect,3000); };
  ws.onmessage=function(e){
    if(e.data instanceof ArrayBuffer){
      var buf=new Uint8Array(e.data), head=new TextDecoder().decode(buf.slice(0,20));
      if(head.startsWith('FRAME:')){ var m=head.match(/FRAME:(\d+):/); if(m){ var len=parseInt(m[1]),off=m[0].length; document.getElementById('droneImg').src=URL.createObjectURL(new Blob([buf.slice(off,off+len)],{type:'image/jpeg'})); setTimeout(drBoxes,50); } }
      else if(head.startsWith('ROVER:')){ var m2=head.match(/ROVER:(\d+):/); if(m2){ var len2=parseInt(m2[1]),off2=m2[0].length; document.getElementById('roverImg').src=URL.createObjectURL(new Blob([buf.slice(off2,off2+len2)],{type:'image/jpeg'})); } }
    }else{
      var msg=JSON.parse(e.data);
      if(msg.type==='sensor') updSensors(msg.data);
      else if(msg.type==='weather') updWeather(msg.data);
      else if(msg.type==='yolo'){ yoloBoxes=msg.detections||[]; updPestChart(yoloBoxes); }
    }
  };
}

function updSensors(d){
  document.getElementById('airTemp').textContent=d.airTemp.toFixed(1);
  document.getElementById('airHumi').textContent=d.airHumidity.toFixed(0);
  document.getElementById('lightLux').textContent=d.lightLux.toFixed(0);
  document.getElementById('soilPh').textContent=d.soilPh.toFixed(1);
  document.getElementById('windSpd').textContent=d.windSpeed.toFixed(1);
  document.getElementById('soilTemp').textContent=d.soilTemp.toFixed(1);
  document.getElementById('soilHumi').textContent=d.soilHumidity.toFixed(0);
  document.getElementById('soilEc').textContent=d.soilConductivity.toFixed(1);
  document.getElementById('loraStatus').textContent='LoRa: 已接收实时数据';
}

function updWeather(d){
  document.getElementById('weatherInfo').innerHTML='<span style="font-size:16px;">'+d.icon+'</span> <b>'+d.desc+' '+d.temp+'℃</b><br>体感 '+d.temp+'℃ | 湿度 '+d.rh+'% | '+d.wind;
}

var pestChart=null;
function updPestChart(dets){
  if(!dets||!dets.length)return;
  dets.forEach(function(d){ var c=d.class; if(!pestCounts[c])pestCounts[c]=0; pestCounts[c]++; });
  var labels=Object.keys(pestCounts).filter(function(k){return k!=='Healthy';});
  var data=labels.map(function(k){return pestCounts[k];});
  var colors={AlgalLeafSpot:'#2196F3',BrownBlight:'#F44336',GrayBlight:'#9E9E9E',Helopeltis:'#FF9800',RedLeafSpot:'#E91E63'};
  var ctx=document.getElementById('pestChart').getContext('2d');
  if(!pestChart) pestChart=new Chart(ctx,{type:'pie',data:{labels:[],datasets:[{data:[],backgroundColor:[]}]},options:{plugins:{legend:{labels:{color:'#90A4AE'}}},responsive:true,maintainAspectRatio:false}});
  pestChart.data.labels=labels;
  pestChart.data.datasets[0].data=data;
  pestChart.data.datasets[0].backgroundColor=labels.map(function(k){return colors[k.replace(/\s/g,'')]||'#4CAF50';});
  pestChart.update();
}

function drBoxes(){
  var img=document.getElementById('droneImg'),canvas=document.getElementById('droneCanvas');
  if(!img||!img.naturalWidth)return;
  canvas.width=img.clientWidth; canvas.height=img.clientHeight;
  var ctx=canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!yoloBoxes.length)return;
  var sx=canvas.width/img.naturalWidth, sy=canvas.height/img.naturalHeight;
  var clrs={'Algal Leaf Spot':'#2196F3','Brown Blight':'#F44336','Gray Blight':'#9E9E9E','Helopeltis':'#FF9800','Red Leaf Spot':'#E91E63','Healthy':'#4CAF50'};
  yoloBoxes.forEach(function(d){ var x=d.x1*sx,y=d.y1*sy,w=(d.x2-d.x1)*sx,h=(d.y2-d.y1)*sy,c=clrs[d.class]||'#FFF'; ctx.strokeStyle=c;ctx.lineWidth=2;ctx.strokeRect(x,y,w,h); ctx.fillStyle=c;ctx.font='12px sans-serif';ctx.fillText(d.class+' '+(d.score*100).toFixed(0)+'%',x,y-4); });
}

function sendCmd(c,d){ if(ws&&ws.readyState===1)ws.send(JSON.stringify({cmd:c,data:d||{}})); }
function roverCmd(k,d){ sendCmd('rover',{key:k,down:!!d}); }
function sendChat(){ var inp=document.getElementById('chatInput'); if(inp.value.trim()){ sendCmd('chat',{msg:inp.value}); inp.value=''; } }
function sendChatVoice(){ sendCmd('voice',{}); }

// 键盘 WASD
document.addEventListener('keydown',function(e){ var m={87:'w',65:'a',83:'s',68:'d'}; if(m[e.keyCode]){e.preventDefault();roverCmd(m[e.keyCode],true);} });
document.addEventListener('keyup',function(e){ var m={87:'w',65:'a',83:'s',68:'d'}; if(m[e.keyCode]){e.preventDefault();roverCmd(m[e.keyCode],false);} });

// 主题切换
document.getElementById('themeBtn').onclick=function(){
  darkMode=!darkMode;
  var root=document.documentElement;
  if(darkMode){
    root.style.setProperty('--bg','#0a1628');root.style.setProperty('--panel','#0d1f30');root.style.setProperty('--text','#E8F4FF');
    root.style.setProperty('--border','#1a3040');root.style.setProperty('--cardBg','#0a1420');root.style.setProperty('--sub','#90A4AE');
    this.textContent='☀️ 日间';
  }else{
    root.style.setProperty('--bg','#f5f7fa');root.style.setProperty('--panel','#ffffff');root.style.setProperty('--text','#333');
    root.style.setProperty('--border','#e0e0e0');root.style.setProperty('--cardBg','#f9f9f9');root.style.setProperty('--sub','#666');
    this.textContent='🌙 夜间';
  }
};

// 设备控制按钮
document.getElementById('pumpBtn').onclick=function(){ sendCmd('pump','toggle'); };
document.getElementById('lampBtn').onclick=function(){ sendCmd('lamp','toggle'); };

connect();
setInterval(drBoxes,100);
</script>
</body>
</html>
