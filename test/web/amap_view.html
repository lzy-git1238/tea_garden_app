<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tea Garden AMap</title>
  <style>
    html, body, #map {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0d1f2e;
      font-family: "Microsoft YaHei", sans-serif;
    }
    .banner {
      position: absolute;
      z-index: 999;
      top: 10px;
      left: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(8, 22, 35, 0.82);
      color: #dce8f2;
      font-size: 12px;
      border: 1px solid rgba(93, 124, 150, 0.5);
    }
    .warn {
      color: #ff8a80;
      font-weight: 700;
    }
  </style>
  <script src="https://webapi.amap.com/maps?v=2.0&key=__AMAP_KEY__"></script>
</head>
<body>
  <div id="map"></div>
  <div class="banner" id="banner">AMap loading...</div>
  <script>
    (function () {
      const key = "__AMAP_KEY__";
      const lng = Number("__CENTER_LNG__") || 120.135947;
      const lat = Number("__CENTER_LAT__") || 30.274084;
      const zoom = Number("__ZOOM__") || 14;
      const banner = document.getElementById("banner");

      if (!key) {
        banner.innerHTML = '<span class="warn">Missing TEA_AMAP_KEY</span>. Set env var and restart app.';
        return;
      }

      if (typeof AMap === "undefined") {
        banner.innerHTML = '<span class="warn">AMap JS SDK load failed</span>. Check network/API key.';
        return;
      }

      const map = new AMap.Map("map", {
        viewMode: "3D",
        zoom: zoom,
        center: [lng, lat],
        layers: [
          new AMap.TileLayer.Satellite(), // 卫星地图图层
          new AMap.TileLayer.RoadNet()    // 路网图层（可选，用于在卫星图上显示道路）
        ]
      });

      const marker = new AMap.Marker({
        position: [lng, lat],
        title: "Tea Garden Center"
      });
      map.add(marker);

      const ring = new AMap.Circle({
        center: [lng, lat],
        radius: 300,
        strokeColor: "#00d4ff",
        strokeOpacity: 0.9,
        strokeWeight: 2,
        fillColor: "#00d4ff",
        fillOpacity: 0.12
      });
      map.add(ring);

      banner.textContent = "AMap connected. Ready for spectral overlays.";
    })();
  </script>
</body>
</html>
