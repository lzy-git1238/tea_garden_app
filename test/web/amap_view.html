<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tea Garden — 星图云</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { margin:0; padding:0; width:100%; height:100%; background:#0a1628; }
    .banner {
      position:absolute; z-index:999; top:10px; left:10px; padding:6px 10px;
      border-radius:4px; background:rgba(10,35,70,0.85); color:#E8F4FF;
      font:12px "Microsoft YaHei",sans-serif;
      border:1px solid #1a6fa8; border-top:2px solid #2a9fd8;
    }
    .warn { color:#ff8a80; font-weight:700; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="banner" id="banner">星图云加载中...</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (function () {
      const token   = "__GEOVIS_TOKEN__";
      const lat     = Number("__CENTER_LAT__") || 30.274084;
      const lng     = Number("__CENTER_LNG__") || 120.135947;
      const zoom    = Number("__ZOOM__") || 14;
      const banner  = document.getElementById("banner");

      if (!token || token.startsWith("__")) {
        banner.innerHTML = '<span class="warn">未配置星图云 Token</span>。设置 TEA_GEOVIS_TOKEN 环境变量。';
        return;
      }

      // 星图云 XYZ 瓦片
      const tileUrl = "https://api.open.geovisearth.com/pj/base/v1/img/{z}/{x}/{y}?format=webp&tmsIds=w&token=" + token;

      window.map = L.map("map", {
        center: [lat, lng],
        zoom: zoom,
        zoomControl: true,
        attributionControl: false,
        preferCanvas: true,
        updateWhenIdle: true
      });

      L.tileLayer(tileUrl, {
        maxZoom: 20,
        maxNativeZoom: 16,
        minZoom: 3
      }).addTo(map);

      // 茶园中心标记
      L.marker([lat, lng], {
        title: "Tea Garden Center"
      }).addTo(map).bindPopup("茶园中心");

      banner.textContent = "星图云 · 茶园";
    })();
  </script>
</body>
</html>
